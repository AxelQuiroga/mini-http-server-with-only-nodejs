<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeStream - Biblioteca Multimedia</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <span class="logo-icon">🎬</span>
      <h1>NodeStream</h1>
    </div>
  </header>

  <main class="container">
    <!-- Seccion del Reproductor Principal -->
    <section class="player-section">
      <div class="video-wrapper">
        <video id="video-player" controls preload="metadata">
          <p>Tu navegador no soporta reproducción de video HTML5.</p>
        </video>
      </div>
      <div id="video-details" class="video-details" hidden></div>
    </section>

    <!-- Seccion de la Biblioteca -->
    <section class="library-section">

      <!-- wrapper para alinear título + botón de upload en una fila -->
      <div class="library-header">
        <h2>Biblioteca de Videos</h2>
        <button
          id="btn-upload"
          class="btn-upload"
          type="button"
        >Subir video</button>
        <input
          type="file"
          id="file-input"
          class="file-input"
          accept=".mp4,.mkv,.webm,.mov,.avi"
          hidden
        />
      </div>

      <!-- Zona de upload: oculta por defecto, se muestra durante el upload -->
      <div id="upload-zone" class="upload-zone" hidden>

        <!-- Fila 1: nombre del archivo + estado -->
        <div class="upload-header">
          <span
            id="upload-filename"
            class="upload-filename"
          ></span>
          <span
            id="upload-status"
            class="upload-status"
            aria-live="polite"
          ></span>
        </div>

        <!-- Fila 2: barra de progreso + porcentaje -->
        <div class="upload-progress-row">
          <div
            id="upload-progress-track"
            class="upload-progress-track"
            role="progressbar"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="Progreso de subida"
          >
            <div
              id="upload-progress-fill"
              class="upload-progress-fill"
            ></div>
          </div>
          <span
            id="upload-percentage"
            class="upload-percentage"
          ></span>
        </div>

        <!-- Fila 3: bytes enviados / total -->
        <span
          id="upload-bytes"
          class="upload-bytes"
        ></span>

      </div>

      <!-- ui.js renderiza las tarjetas o los estados de carga/error dentro de este contenedor -->
      <div id="video-list" class="video-list"></div>
    </section>
  </main>

  <!-- script con type="module" para habilitar import/export nativo en app.js -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>NodeStream</title>
</head>

<body>

    <header>
        <h1>NodeStream</h1>
        <p>Servidor HTTP construido con Node.js y TypeScript</p>
    </header>

    <main>

        <section>
            <h2>Videos</h2>

            <div id="video-list">
                <p>Cargando videos...</p>
            </div>
        </section>

        <section>
            <video
                id="video-player"
                controls
                width="800"
            >
                Tu navegador no soporta video HTML5.
            </video>
        </section>

    </main>

    <script src="/js/app.js"></script>

</body>
</html>
